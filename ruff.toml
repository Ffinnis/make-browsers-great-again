line-length = 120
target-version = "py312"
extend-exclude = ["build", "third_party"]

[lint]
select = [
    "E", "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PL",
    "RUF",
]
ignore = [
    "PLR2004",
    "RUF001",
]

[lint.per-file-ignores]
"bench/trend.py" = ["E501"]

[lint.pylint]
max-args = 7
max-positional-args = 7
