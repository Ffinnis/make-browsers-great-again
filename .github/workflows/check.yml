name: Check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          brew update --quiet
          brew bundle
          rustup toolchain install
          swiftformat --version; swiftlint version; clang-format --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ hashFiles('core/Cargo.lock', 'media/Cargo.lock', 'rust-toolchain.toml') }}
      - run: scripts/check.sh

  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: third_party/cef
          key: cef-${{ hashFiles('scripts/fetch-cef.sh') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('core/Cargo.lock', 'media/Cargo.lock') }}
      - name: Fetch Rust crates
        run: |
          for attempt in 1 2 3 4 5; do
            cargo fetch --locked --manifest-path core/Cargo.toml &&
              cargo fetch --locked --manifest-path media/Cargo.toml && exit 0
            echo "::warning::Fetching crates failed (attempt $attempt), retrying"
            sleep $((attempt * 15))
          done
          exit 1
      - run: scripts/build.sh
        env:
          CARGO_NET_OFFLINE: "true"
